name: Release

# 版本号的唯一来源是 tag：在 GitHub 上发布 Release（tag 形如 v0.2.0）即触发构建。
# 想自动算下一个版本，用 Bump Version 工作流；它打 tag、建 Release 后会显式 dispatch 这里。
on:
  release:
    types: [published]
  # Bump Version 用 GITHUB_TOKEN 创建 Release 时，GitHub 不会触发 release 事件；
  # 因此 bump 工作流会显式 dispatch 这个入口，并把 tag 传进来。
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 Release tag（vX.Y.Z）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_NAME: ${{ github.event.release.name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: 查找 Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 准备 v2ray sidecar
        run: bun run prepare:sidecar

      - name: 同步版本号
        run: bun scripts/set-version.mjs ${{ env.RELEASE_TAG }}

      - name: 构建安装包与更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ github.event.release.body }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: 校验更新清单
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --dir . --clobber
          node -e "
            const j = require('./latest.json');
            const p = j.platforms && j.platforms['windows-x86_64'];
            if (!p || !p.url || !p.signature) {
              console.error('latest.json 缺少 windows-x86_64 条目，应用内更新会失效');
              process.exit(1);
            }
            const expected = process.env.TAG.replace(/^v/, '');
            if (j.version !== expected) {
              console.error('latest.json 版本与 tag 不一致：', j.version, '≠', expected);
              process.exit(1);
            }
            if (!/\.exe$/i.test(new URL(p.url).pathname)) {
              console.error('latest.json 没有指向 NSIS setup.exe：', p.url);
              process.exit(1);
            }
            console.log('latest.json 正常：版本', j.version, '→', p.url);
          "
          ASSET="$(node -e "
            const p = require('./latest.json').platforms['windows-x86_64'];
            console.log(decodeURIComponent(new URL(p.url).pathname.split('/').pop()));
          ")"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "latest.json 指向的资产不存在：$ASSET"
            exit 1
          fi
          echo "更新资产存在：$ASSET"

      - name: 补充 Release 说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          NOTES=""
          COMMIT="$(git rev-parse HEAD)"
          if gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
               -f tag_name="$TAG" -f target_commitish="$COMMIT" --jq .body > notes.md 2>/dev/null; then
            NOTES="$(cat notes.md)"
          fi
          {
            echo "## 下载"
            echo
            echo "- Windows 安装包：\`NanoShadowrocket_${TAG#v}_x64-setup.exe\`"
            echo "- 应用内更新：设置页 → 关于 → 软件更新"
            echo "- 手动下载全部资产：[Releases 页面](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            echo
            echo "## 变更"
            echo
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "_暂无自动生成的变更列表_"
            fi
            echo
            echo "## 校验"
            echo
            echo "安装包 \`NanoShadowrocket_${TAG#v}_x64-setup.exe\` 由 minisign 签名，客户端会通过 \`latest.json\` 中的签名自动校验。"
          } > body.md
          gh release edit "$TAG" --notes-file body.md

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
            echo "已发布 $TAG"
          else
            echo "$TAG 已经是发布状态，跳过"
          fi
