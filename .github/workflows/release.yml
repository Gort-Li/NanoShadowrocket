name: Release

# 版本号的唯一来源是 tag，一次跑完「构建 → 校验 → 写文档 → 发布」。
#
# 触发路径：
#   1. 在 GitHub 上建 Release 并点 Publish（release: published）—— 主路径，秒级触发
#   2. Bump Version 算出版本号后 dispatch 本工作流
#   3. 手工 dispatch，填 tag
#
# 注意：draft release 的 created / edited 不触发任何 workflow（GitHub 限制），
# 所以别停在「Save draft」——要么直接 Publish，要么用 Bump Version。
#
# 幂等：同一个 tag 重复触发时，资产已齐就直接跳过构建，只做校验与发布。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（vX.Y.Z），必须已经存在对应的 Release"
        required: true
        type: string
      force:
        description: "资产已存在也强制重建"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一个 tag 串行：重复触发（dispatch 重跑、bump 与事件撞车）时后一个排队，
# 轮到它时资产已齐，只做校验和发布，不会重复编译。
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

run-name: Release ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # 先摸清现状：tag 合法性、Release 是否存在、资产是否已齐、要不要先转回 draft。
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_body: ${{ steps.resolve.outputs.release_body }}
      is_draft: ${{ steps.resolve.outputs.is_draft }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      need_build: ${{ steps.resolve.outputs.need_build }}
    steps:
      - name: 解析 tag 与 Release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            echo "没拿到 tag：事件里没有 release.tag_name，dispatch 也没填 tag"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "tag 格式不合法：「$TAG」。要求 vX.Y.Z，可选 -beta.1 这类后缀"
            exit 1
          fi
          echo "tag = $TAG"

          if ! gh api "repos/$REPO/releases/tags/$TAG" > release.json 2>/dev/null; then
            echo "找不到 tag 为 $TAG 的 Release。先在 GitHub 上建好 Release（draft 也行），再跑这个工作流。"
            exit 1
          fi

          ID="$(jq -r .id release.json)"
          NAME="$(jq -r '.name // ""' release.json)"
          DRAFT="$(jq -r .draft release.json)"
          PRE="$(jq -r .prerelease release.json)"
          BODY="$(jq -r '.body // ""' release.json)"
          test -n "$ID"
          NAME="${NAME:-$TAG}"

          ASSETS="$(jq -r '.assets[].name' release.json)"
          if echo "$ASSETS" | grep -Fxq 'latest.json'; then HAS_UPDATER=1; else HAS_UPDATER=0; fi
          if echo "$ASSETS" | grep -Eq '_x64-setup\.exe$'; then HAS_EXE=1; else HAS_EXE=0; fi

          NEED_BUILD=true
          if [ "$HAS_UPDATER" = "1" ] && [ "$HAS_EXE" = "1" ] && [ "$FORCE" != "true" ]; then
            NEED_BUILD=false
            echo "资产已齐（latest.json + setup.exe），跳过构建"
          fi

          # 已经公开但还没构建完：先转回 draft，别让 releases/latest 指向半成品。
          # 构建成功后在 finalize 里再发布，失败就停在 draft，客户端不受影响。
          if [ "$NEED_BUILD" = "true" ] && [ "$DRAFT" = "false" ]; then
            if gh release edit "$TAG" --draft=true; then
              DRAFT=true
              echo "::notice title=已转回 draft::$TAG 原本是发布状态但缺少资产，已临时转为 draft，构建完成后自动发布"
            else
              echo "::warning title=转 draft 失败::$TAG 保持发布状态继续构建，构建完成前客户端可能读不到 latest.json"
            fi
          fi

          {
            echo "tag=$TAG"
            echo "release_id=$ID"
            echo "release_name=$NAME"
            echo "is_draft=$DRAFT"
            echo "is_prerelease=$PRE"
            echo "need_build=$NEED_BUILD"
            echo "release_body<<__NANO_BODY_EOF__"
            printf '%s\n' "$BODY"
            echo "__NANO_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.need_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 准备 v2ray sidecar
        run: bun run prepare:sidecar

      - name: 同步版本号
        run: bun scripts/set-version.mjs ${{ needs.plan.outputs.tag }}

      - name: 构建安装包与更新包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.plan.outputs.release_id }}
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.release_name }}
          releaseBody: ${{ needs.plan.outputs.release_body }}
          # 显式跟随当前状态：tauri-action 的默认值 false 会把 draft 提前公开。
          releaseDraft: ${{ needs.plan.outputs.is_draft }}
          prerelease: ${{ needs.plan.outputs.is_prerelease }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

  # 构建成功（或因资产已齐而跳过）才收尾；构建失败时 release 停在 draft，等 Watch 重试。
  finalize:
    needs: [plan, build]
    if: >-
      ${{
        !cancelled()
        && needs.plan.result == 'success'
        && (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      REPO: ${{ github.repository }}
    steps:
      - name: 校验更新清单
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$REPO" --pattern latest.json --dir . --clobber
          node -e "
            const j = require('./latest.json');
            const p = j.platforms && j.platforms['windows-x86_64'];
            if (!p || !p.url || !p.signature) {
              console.error('latest.json 缺少 windows-x86_64 条目，应用内更新会失效');
              process.exit(1);
            }
            const expected = process.env.TAG.replace(/^v/, '');
            if (j.version !== expected) {
              console.error('latest.json 版本与 tag 不一致：', j.version, '≠', expected);
              process.exit(1);
            }
            if (!/\.exe$/i.test(new URL(p.url).pathname)) {
              console.error('latest.json 没有指向 NSIS setup.exe：', p.url);
              process.exit(1);
            }
            console.log('latest.json 正常：版本', j.version, '→', p.url);
          "
          ASSET="$(node -e "
            const p = require('./latest.json').platforms['windows-x86_64'];
            console.log(decodeURIComponent(new URL(p.url).pathname.split('/').pop()));
          ")"
          if ! gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "latest.json 指向的资产不存在：$ASSET"
            exit 1
          fi
          echo "更新资产存在：$ASSET"

      - name: 补充 Release 说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq '.body // ""' > current.md

          # 手写正文保护：优先取 nano:manual 标记区间；没有标记时，
          # 判断旧正文是不是自动生成的（GitHub 的 generate-notes 或旧版本工作流），
          # 是就丢弃重写，不是就当作用户手写内容原样保留。
          if grep -qF '<!-- nano:manual:start -->' current.md; then
            awk '/<!-- nano:manual:start -->/{f=1;next} /<!-- nano:manual:end -->/{f=0} f' \
              current.md > manual.md
          elif grep -qF '**Full Changelog**' current.md \
            || grep -qF '## What'"'"'s Changed' current.md \
            || { grep -qF '## 下载' current.md && grep -qF '## 校验' current.md; }; then
            : > manual.md
            echo "旧正文是自动生成的，丢弃后重新生成"
          else
            cp current.md manual.md
          fi

          # 保证以换行结尾，否则结束标记会粘在最后一行文字后面
          if [ -s manual.md ] && [ -n "$(tail -c 1 manual.md)" ]; then
            printf '\n' >> manual.md
          fi

          COMMIT="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          NOTES=""
          if gh api -X POST "repos/$REPO/releases/generate-notes" \
               -f tag_name="$TAG" -f target_commitish="$COMMIT" --jq .body > generated.md 2>/dev/null; then
            NOTES="$(cat generated.md)"
          fi

          {
            echo '<!-- nano:manual:start -->'
            cat manual.md
            echo '<!-- nano:manual:end -->'
            echo
            echo "## 下载"
            echo
            echo "- Windows 安装包：\`NanoShadowrocket_${TAG#v}_x64-setup.exe\`"
            echo "- 应用内更新：设置页 → 关于 → 软件更新"
            echo "- 手动下载全部资产：[Releases 页面](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            echo
            echo "## 变更"
            echo
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "_暂无自动生成的变更列表_"
            fi
            echo
            echo "## 校验"
            echo
            echo "安装包 \`NanoShadowrocket_${TAG#v}_x64-setup.exe\` 由 minisign 签名，客户端会通过 \`latest.json\` 中的签名自动校验。"
          } > body.md
          gh release edit "$TAG" --notes-file body.md

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$DRAFT" != "true" ]; then
            echo "$TAG 已经是发布状态，跳过"
            exit 0
          fi
          PRE="$(gh release view "$TAG" -R "$REPO" --json isPrerelease --jq .isPrerelease)"
          if [ "$PRE" = "true" ]; then
            # 预发布不占用 releases/latest，客户端检查更新时看不到它。
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$REPO" --draft=false --latest
          fi
          echo "已发布 $TAG"